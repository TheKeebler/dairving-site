<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Tetris</title>
<link rel="stylesheet" href="tetris.css">
</head>
<body>
    <audio id="tetrisMusic" loop>
  <source src="music/Music - 1.mp3" type="audio/mpeg">
</audio>
    <a href="/" class="back-link">← Back to Home</a>
    
    <div class="game-container">
        <div class="board-wrap">
            <canvas id="gameCanvas" class="game-board" width="300" height="600"></canvas>
            <div class="paused-overlay" id="pausedOverlay">PAUSED</div>
        </div>
        
        <div class="side-panel">
            <div class="panel-section">
                <h2>Score</h2>
                <div class="score-display" id="score">0</div>
            </div>
            
            <div class="panel-section">
                <h2>Level</h2>
                <div class="level-display" id="level">1</div>
            </div>
            
            <div class="panel-section">
                <h2>Lines</h2>
                <div class="lines-display" id="lines">0</div>
            </div>
            
            <div class="panel-section">
                <h2>Next</h2>
                <canvas id="nextPieceCanvas" width="120" height="120"></canvas>
            </div>
            
            <div class="panel-section">
                <h2>Controls</h2>
                <div class="controls">
                    <div><span>←/→</span><span>Move</span></div>
                    <div><span>↓</span><span>Soft Drop</span></div>
                    <div><span>Space</span><span>Hard Drop</span></div>
                    <div><span>↑ / X</span><span>Rotate</span></div>
                    <div><span>P</span><span>Pause</span></div>
                </div>
            </div>
        </div>
    </div>

    <div class="mobile-controls">
        <div class="control-row">
            <button class="mobile-btn" id="rotateBtn">↻</button>
        </div>
        <div class="control-row">
            <button class="mobile-btn" id="leftBtn">←</button>
            <button class="mobile-btn" id="downBtn">↓</button>
            <button class="mobile-btn" id="rightBtn">→</button>
        </div>
        <div class="control-row">
            <button class="mobile-btn wide" id="dropBtn">DROP</button>
        </div>
    </div>

    <div class="game-over-overlay" id="gameOverOverlay">
        <div class="game-over-content">
            <h1>GAME OVER</h1>
            <p>Final Score: <span id="finalScore">0</span></p>
            <p>Lines: <span id="finalLines">0</span></p>
            <p>Level: <span id="finalLevel">1</span></p>
            <button id="playAgainBtn">Play Again</button>
        </div>
    </div>

    <script src="tetris.js"></script>
    
</body>
</html>
