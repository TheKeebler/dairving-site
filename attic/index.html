<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self'; img-src 'self' data: blob:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Attic planner</title>
<link rel="stylesheet" href="attic.css"></head><body><div id="a">
<div class="b"><b>Attic planner</b>
<button data-v="orbit">Overview</button><button data-v="plan">Plan</button><button data-v="stairs">From stairs</button><button data-v="bed">From bedroom end</button>
<button id="undo" title="Ctrl or Cmd + Z">Undo</button><button id="lstb">Items</button><label>Walls <input type="color" id="wc" value="#c8a27a"></label>
<button id="mv" title="When on, dragging empty space moves the view">Move view</button><button id="ms" title="Click two points to measure a distance">Measure</button><button id="mc" title="Remove all measurements">Clear</button><span class="row-flex"><button data-k="ArrowLeft" title="Move left">&larr;</button><button data-k="ArrowUp" title="Move forward">&uarr;</button><button data-k="ArrowDown" title="Move back">&darr;</button><button data-k="ArrowRight" title="Move right">&rarr;</button><button id="zi" title="Zoom in">+</button><button id="zo" title="Zoom out">&minus;</button></span>
<small>Drag a piece to move it. Red means it does not fit. To move the view: Move view button, right-drag, two fingers, or arrow keys and WASD. Double-click the floor to look there. Measure: click two points, snaps near corners of pieces. Esc to exit.</small></div>
<div class="b" id="lst" hidden></div>
<div id="c"></div>
<div class="b" id="sel" hidden><span id="nm"></span><span id="msg"></span><button id="hid" title="H">Hide</button><button id="ctr">Center</button><button id="rot">Rotate</button><input type="color" id="col" value="#8a6a4f"><button id="del">Remove</button></div>
<div class="b" id="cat"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="attic.js"></script></body></html>
