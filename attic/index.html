#home{color:var(--ac);text-decoration:none;white-space:nowrap}
#home:hover{text-decoration:underline}
#c{flex:1;min-height:0;touch-action:none}
#c canvas{display:block;width:100%;height:100%}
#msg{color:#c0392b;font-weight:600}
small{opacity:.7}
